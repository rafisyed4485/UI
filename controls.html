<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Controls - Dream IT Solutions</title>

  <!-- jQuery UI CSS -->
  <link rel="stylesheet"
    href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 30px;
      color: #333;
    }

    a {
      text-decoration: none;
      color: #1877f2;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 25px;
      font-size: 16px;
    }

    h2 {
      margin-bottom: 20px;
      color: #222;
    }

    /* =========================
       TABLE SECTION
    ========================= */

    .table-section {
      background: #fff;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 10px;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #1877f2;
      color: white;
      font-size: 15px;
    }

    tr:hover {
      background: #f8fbff;
      transition: 0.3s;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      margin-right: 8px;
      transition: 0.3s;
    }

    .remove-btn {
      background: #e74c3c;
    }

    .remove-btn:hover {
      background: #c0392b;
    }

    .edit-btn {
      background: #27ae60;
    }

    .edit-btn:hover {
      background: #1f8a4c;
    }

    .save-btn {
      background: #1877f2;
    }

    .save-btn:hover {
      background: #0d63d6;
    }

    .reset-link {
      margin-top: 18px;
      display: inline-block;
      color: #1877f2;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      font-size: 15px;
    }

    td input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* =========================
       DATE PICKER SECTION
    ========================= */

    .date-picker-section {
      margin-top: 45px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 700px;
    }

    .date-picker-section h2 {
      text-align: center;
      margin-bottom: 35px;
      color: #1877f2;
      font-size: 30px;
    }

    .container {
      width: 100%;
    }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 22px;
      gap: 20px;
    }

    .row label {
      width: 160px;
      font-size: 17px;
      font-weight: 600;
      color: #333;
    }

    .row input[type="text"] {
      flex: 1;
      height: 44px;
      border: 1px solid #d0d7e2;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 15px;
      background: #fafafa;
      transition: 0.3s;
    }

    .row input[type="text"]:focus {
      outline: none;
      border-color: #1877f2;
      background: white;
      box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.12);
    }

    .calendar-icon {
      width: 44px;
      height: 44px;
      background: #1877f2;
      color: white;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .calendar-icon:hover {
      background: #0d63d6;
      transform: scale(1.05);
    }

    /* =========================
       DATE PICKER CUSTOM UI
    ========================= */

    .ui-datepicker {
      width: 300px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: white;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
    }

    .ui-datepicker-header {
      background: linear-gradient(135deg, #1877f2, #0d63d6);
      border: none;
      border-radius: 10px;
      color: white;
      padding: 10px;
    }

    .ui-datepicker-title {
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .ui-datepicker-prev,
    .ui-datepicker-next {
      cursor: pointer;
    }

    .ui-datepicker-calendar {
      margin-top: 10px;
    }

    .ui-datepicker-calendar th {
      color: #444;
      font-size: 13px;
      padding: 8px;
    }

    .ui-datepicker-calendar td a {
      background: #f5f7fb;
      border-radius: 6px;
      border: none !important;
      color: #333 !important;
      text-align: center;
      padding: 8px;
      transition: 0.2s;
    }

    .ui-datepicker-calendar td a:hover {
      background: #dbe9ff;
      color: #1877f2 !important;
    }

    .ui-state-active,
    .ui-widget-content .ui-state-active {
      background: #1877f2 !important;
      color: white !important;
      border-radius: 6px;
    }

  </style>
</head>

<body>

  <a href="home.html">&larr; Back to Home</a>

  <!-- TABLE SECTION -->

  <div class="table-section">

    <h2>Table Example</h2>

    <table id="userTable">

      <thead>
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody></tbody>

    </table>

    <div class="reset-link" onclick="resetTable()">
      Reset Table Rows
    </div>

  </div>

  <!-- DATE PICKER SECTION -->

  <div class="date-picker-section">

    <h2>Date Picker Controls</h2>

    <div class="container">

      <div class="row">
        <label>First Date</label>
        <input type="text" id="date1">
      </div>

      <div class="row">
        <label>Second Date</label>
        <input type="text" id="date2">
      </div>

      <div class="row">
        <label>Third Date</label>
        <input type="text" id="date3">
      </div>

      <div class="row">
        <label>Fourth Date</label>
        <input type="text" id="date4">
      </div>

      <div class="row">
        <label>Fifth Date</label>
        <input type="text" id="date5">
      </div>

      <div class="row">
        <label>Sixth Date</label>
        <input type="text" id="date6">
        <span class="calendar-icon">🗓️</span>
      </div>

    </div>

  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- jQuery UI -->
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

  <script>

    /* =========================
       TABLE DATA
    ========================= */

    const originalData = [
      { firstname: 'John', lastname: 'Doe', email: 'john@example.com' },
      { firstname: 'July', lastname: 'Dooley', email: 'july@example.com' },
      { firstname: 'Jane', lastname: 'Doe', email: 'jane@example.com' },
      { firstname: 'John', lastname: 'Little', email: 'little@example.com' },
    ];

    let shuffledData = [];

    /* =========================
       SHUFFLE FUNCTION
    ========================= */

    function shuffleArray(array) {

      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];

      }

      return copy;
    }

    /* =========================
       RENDER TABLE
    ========================= */

    function renderTable(data) {

      const tbody = document.querySelector('#userTable tbody');

      tbody.innerHTML = '';

      data.forEach((row, idx) => {

        const tr = document.createElement('tr');

        tr.dataset.index = idx;

        tr.innerHTML = `
          <td><span>${row.firstname}</span></td>
          <td><span>${row.lastname}</span></td>
          <td><span>${row.email}</span></td>

          <td>
            <button class="remove-btn" onclick="removeRow(${idx})">
              Remove
            </button>

            <button class="edit-btn" onclick="toggleEdit(${idx}, this)">
              Edit
            </button>
          </td>
        `;

        tbody.appendChild(tr);

      });

    }

    /* =========================
       REMOVE ROW
    ========================= */

    function removeRow(index) {

      shuffledData.splice(index, 1);

      renderTable(shuffledData);

    }

    /* =========================
       EDIT / SAVE ROW
    ========================= */

    function toggleEdit(index, btn) {

      const tr = document.querySelector(
        `#userTable tbody tr[data-index="${index}"]`
      );

      const tdSpans = tr.querySelectorAll('td span');

      const isEditing = btn.innerText === 'Edit';

      if (isEditing) {

        tdSpans.forEach(span => {

          const input = document.createElement('input');

          input.type = 'text';

          input.value = span.textContent;

          span.replaceWith(input);

        });

        btn.innerText = 'Save';

        btn.classList.replace('edit-btn', 'save-btn');

      } else {

        saveEdit(index);

      }

    }

    function saveEdit(index) {

      const tr = document.querySelector(
        `#userTable tbody tr[data-index="${index}"]`
      );

      const inputs = tr.querySelectorAll('td input');

      shuffledData[index] = {
        firstname: inputs[0].value.trim(),
        lastname: inputs[1].value.trim(),
        email: inputs[2].value.trim(),
      };

      renderTable(shuffledData);

    }

    /* =========================
       RESET + SHUFFLE TABLE
    ========================= */

    function resetTable() {

      // Shuffle dynamically every click
      shuffledData = shuffleArray([...originalData]);

      renderTable(shuffledData);

    }

    /* =========================
       INITIAL LOAD
    ========================= */

    shuffledData = shuffleArray([...originalData]);

    renderTable(shuffledData);

    /* =========================
       DATE PICKER
    ========================= */

    $(function () {

      $("#date1, #date2, #date3, #date4, #date5, #date6").datepicker({
        showAnim: "fadeIn",
        dateFormat: "dd-mm-yy"
      });

      $(".calendar-icon").click(function () {

        $("#date6").datepicker("show");

      });

    });

  </script>

</body>

</html>
